# Push to master: build and test. When the pom's version has no release yet
# (a version bump), also: tag v<version>, create a GitHub Release with the jar,
# and publish it to GitHub Packages (the other plugins build against it).
# The jar reaches the servers through the network's agent (backend and staging take
# the newest release; live only through a release): see the wos-api repo's
# deploy-network/README-network.md.
# Same file in every plugin repo: keep them in sync.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release
      packages: write # publish Core
    env:
      # Maven's "github" server (GitHub Packages, where Core is published).
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: GH_PACKAGES_USER
          server-password: GH_PACKAGES_TOKEN

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Is this a new version?
        id: v
        run: |
          VERSION=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          JAR=$(ls target/*.jar | grep -v -e '/original-' -e '-sources' -e '-javadoc' | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]] || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released (or a snapshot): build only."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New version v$VERSION: releasing $JAR"
          fi

      - name: Publish to GitHub Packages (the other plugins build against it)
        if: steps.v.outputs.new == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Packages never overwrites a version: skip one that is already there.
          POM="https://maven.pkg.github.com/world-of-sorcery/core/me/hektortm/core/$VERSION/core-$VERSION.pom"
          if curl -sf -o /dev/null -u "$GH_PACKAGES_USER:$GH_PACKAGES_TOKEN" "$POM"; then
            echo "::warning::core $VERSION is already in GitHub Packages: not published again (bump the version to publish a change)"
          else
            mvn -B -ntp deploy -DskipTests
          fi
      - name: GitHub Release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.v.outputs.version }}" "${{ steps.v.outputs.jar }}" --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --generate-notes
